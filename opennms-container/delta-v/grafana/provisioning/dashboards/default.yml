# Grafana dashboard provider — reads the baked-in JSON files under
# /etc/grafana/dashboards (placed outside the grafanadata volume so image
# rebuilds refresh the bundled dashboards instead of being shadowed by
# first-boot volume contents). Reloads every 30s; UI edits don't persist
# across container restarts (the JSON file wins).
apiVersion: 1

providers:
  - name: delta-v-bundled
    orgId: 1
    folder: Delta-V
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
