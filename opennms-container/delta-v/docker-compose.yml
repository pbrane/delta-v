---
# Delta-V: OpenNMS microservice-mode deployment (18 services)
# db-init (schema migration, runs once) + Webapp + Minion
# + Alarmd + Pollerd + Collectd
# + Discovery + Trapd + Syslogd + EventTranslator + Enlinkd
# + Provisiond + Bsmd + PerspectivePollerd + Telemetryd
#
# Images: Each daemon has its own image (${IMAGE_PREFIX}/<daemon>:${VERSION})
# built from a shared daemon-base layer. Build with: ./build.sh deltav
# Per-service config overlays remain as local bind mounts.
#
# To use GHCR images, set in .env:
#   IMAGE_PREFIX=ghcr.io/mhuot
#
# Usage:
#   docker compose up -d
#   docker compose ps        # wait for all services to be healthy
#   open http://localhost:8980/opennms  (admin/admin)

services:

  postgres:
    image: postgres:15
    command: ["-c", "max_connections=350"]
    environment:
      POSTGRES_DB: opennms
      POSTGRES_USER: opennms
      POSTGRES_PASSWORD: opennms
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: --auth=md5
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opennms -d opennms"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:latest
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "4"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      CLUSTER_ID: "delta-v-kafka-cluster"
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx1g"
      KAFKA_LOG_RETENTION_MS: "3600000"
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: "300000"
    ports:
      - "19092:19092"
    volumes:
      - kafkadata:/tmp/kraft-combined-logs
    healthcheck:
      # Use lightweight TCP probe instead of kafka-topics.sh (which starts a full JVM)
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Database schema initialization — standalone Spring Boot app that runs
  # Liquibase migrations, then exits. All services that need PostgreSQL
  # should depend on this with condition: service_completed_successfully.
  db-init:
    image: ${IMAGE_PREFIX:-opennms}/db-init:${VERSION}
    container_name: delta-v-db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OPENNMS_DBINIT_ADMIN_URL: jdbc:postgresql://postgres:5432/template1
      OPENNMS_DBINIT_ADMIN_USER: opennms
      OPENNMS_DBINIT_ADMIN_PASSWORD: opennms
      OPENNMS_DBINIT_DATABASE_NAME: opennms
      OPENNMS_DBINIT_DATABASE_USER: opennms
      OPENNMS_DBINIT_DATABASE_PASSWORD: opennms
      OPENNMS_DBINIT_CREATE_USER: "false"
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx512m

  snmp-agent:
    build: ./mock-snmp-agent
    container_name: delta-v-snmp-agent
    hostname: snmp-agent
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 10s
      retries: 3

  minion:
    image: ${IMAGE_PREFIX:-opennms}/minion-boot:${VERSION}
    container_name: delta-v-minion
    hostname: minion-default-01
    cap_add:
      - NET_RAW
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      MINION_ID: minion-default-01
      MINION_LOCATION: Default
      KAFKA_IPC_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_OPTS: >-
        -Xms256m -Xmx512m
        -Djava.security.egd=file:/dev/./urandom
    ports:
      - "8301:8080"           # Actuator (was 8201 Karaf SSH)
      - "11162:1162/udp"      # SNMP Trapd
      - "1514:1514/udp"       # Syslog
      - "4729:4729/udp"       # Flow telemetry (Netflow v5/v9, IPFIX, sFlow)
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  pollerd:
    profiles: [lite, full]
    image: ${IMAGE_PREFIX:-opennms}/pollerd:${VERSION}
    container_name: delta-v-pollerd
    hostname: pollerd
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      JAVA_OPTS: "-Xms512m -Xmx1g -XX:MaxMetaspaceSize=256m -Dorg.opennms.core.ipc.twin.kafka.bootstrap.servers=kafka:9092 -Dorg.opennms.core.ipc.rpc.force-remote=true"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/opennms
      SPRING_DATASOURCE_USERNAME: opennms
      SPRING_DATASOURCE_PASSWORD: opennms
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: opennms-pollerd
      OPENNMS_HOME: /opt/deltav
      OPENNMS_INSTANCE_ID: OpenNMS
      OPENNMS_TSID_NODE_ID: "4"
      OPENNMS_RPC_KAFKA_ENABLED: "true"
      OPENNMS_RPC_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./pollerd-overlay/etc:/opt/deltav/etc:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  collectd:
    profiles: [lite, full]
    image: ${IMAGE_PREFIX:-opennms}/collectd:${VERSION}
    container_name: delta-v-collectd
    hostname: collectd
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      JAVA_OPTS: "-Xms512m -Xmx1g -Dorg.opennms.tsid.node-id=5"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/opennms
      SPRING_DATASOURCE_USERNAME: opennms
      SPRING_DATASOURCE_PASSWORD: opennms
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OPENNMS_HOME: /opt/deltav
      OPENNMS_TIMESERIES_STRATEGY: inmemory
      DELTAV_TIMESERIES_ENABLED: ${DELTAV_TIMESERIES_ENABLED:-true}
    volumes:
      - ./collectd-daemon-overlay/etc:/opt/deltav/etc:ro
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  discovery:
    profiles: [passive, full]
    image: ${IMAGE_PREFIX:-opennms}/discovery:${VERSION}
    container_name: delta-v-discovery
    hostname: discovery
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:MaxMetaspaceSize=256m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/opennms
      SPRING_DATASOURCE_USERNAME: opennms
      SPRING_DATASOURCE_PASSWORD: opennms
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OPENNMS_HOME: /opt/deltav
      INTERFACE_NODE_CACHE_REFRESH_MS: "15000"
      OPENNMS_INSTANCE_ID: OpenNMS
      OPENNMS_TSID_NODE_ID: "24"
      RPC_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RPC_KAFKA_FORCE_REMOTE: "true"
    volumes:
      - ./discovery-overlay/etc:/opt/deltav/etc:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 60s

  trapd:
    profiles: [passive, full]
    image: ${IMAGE_PREFIX:-opennms}/trapd:${VERSION}
    container_name: delta-v-trapd
    hostname: trapd
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:MaxMetaspaceSize=256m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/opennms
      SPRING_DATASOURCE_USERNAME: opennms
      SPRING_DATASOURCE_PASSWORD: opennms
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: opennms-trapd
      KAFKA_SINK_CONSUMER_GROUP: opennms-trapd-sink
      OPENNMS_HOME: /opt/deltav
      INTERFACE_NODE_CACHE_REFRESH_MS: "15000"
      OPENNMS_INSTANCE_ID: OpenNMS
      OPENNMS_TSID_NODE_ID: "20"
    volumes:
      - ./trapd-overlay/etc:/opt/deltav/etc:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  syslogd:
    profiles: [passive, full]
    image: ${IMAGE_PREFIX:-opennms}/syslogd:${VERSION}
    container_name: delta-v-syslogd
    hostname: syslogd
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:MaxMetaspaceSize=256m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/opennms
      SPRING_DATASOURCE_USERNAME: opennms
      SPRING_DATASOURCE_PASSWORD: opennms
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: opennms-syslogd
      KAFKA_SINK_CONSUMER_GROUP: opennms-syslogd-sink
      OPENNMS_HOME: /opt/deltav
      INTERFACE_NODE_CACHE_REFRESH_MS: "15000"
      OPENNMS_INSTANCE_ID: OpenNMS
      OPENNMS_TSID_NODE_ID: "21"
    volumes:
      - ./syslogd-overlay/etc:/opt/deltav/etc:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  eventtranslator:
    profiles: [passive, full]
    image: ${IMAGE_PREFIX:-opennms}/eventtranslator:${VERSION}
    container_name: delta-v-eventtranslator
    hostname: eventtranslator
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:MaxMetaspaceSize=256m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/opennms
      SPRING_DATASOURCE_USERNAME: opennms
      SPRING_DATASOURCE_PASSWORD: opennms
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: opennms-eventtranslator
      OPENNMS_HOME: /opt/deltav
      OPENNMS_INSTANCE_ID: OpenNMS
      OPENNMS_TSID_NODE_ID: "22"
    volumes:
      - ./eventtranslator-overlay/etc:/opt/deltav/etc:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  enlinkd:
    profiles: [full]
    image: ${IMAGE_PREFIX:-opennms}/enlinkd:${VERSION}
    container_name: delta-v-enlinkd
    hostname: enlinkd
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:MaxMetaspaceSize=256m -Dopennms.home=/opt/deltav"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/opennms
      SPRING_DATASOURCE_USERNAME: opennms
      SPRING_DATASOURCE_PASSWORD: opennms
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: enlinkd
      OPENNMS_HOME: /opt/deltav
      OPENNMS_RPC_KAFKA_ENABLED: "true"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 60s
    volumes:
      - ./enlinkd-overlay/etc:/opt/deltav/etc:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  provisiond:
    profiles: [lite, passive, full]
    image: ${IMAGE_PREFIX:-opennms}/provisiond:${VERSION}
    container_name: delta-v-provisiond
    hostname: provisiond
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      JAVA_OPTS: "-Xms512m -Xmx1g -XX:MaxMetaspaceSize=256m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/opennms
      SPRING_DATASOURCE_USERNAME: opennms
      SPRING_DATASOURCE_PASSWORD: opennms
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OPENNMS_HOME: /opt/deltav
      OPENNMS_INSTANCE_ID: OpenNMS
      OPENNMS_TSID_NODE_ID: "25"
      RPC_KAFKA_ENABLED: "true"
      RPC_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RPC_KAFKA_FORCE_REMOTE: "true"
    volumes:
      - ./provisiond-overlay/etc:/opt/deltav/etc
      - ./etc/imports:/opt/deltav/etc/imports
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 60s

  bsmd:
    profiles: [lite, full]
    image: ${IMAGE_PREFIX:-opennms}/bsmd:${VERSION}
    container_name: delta-v-bsmd
    hostname: bsmd
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:MaxMetaspaceSize=256m -Dorg.opennms.alarms.snapshot.sync.ms=10000"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/opennms
      SPRING_DATASOURCE_USERNAME: opennms
      SPRING_DATASOURCE_PASSWORD: opennms
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: opennms-bsmd
      OPENNMS_HOME: /opt/deltav
      OPENNMS_INSTANCE_ID: OpenNMS
      OPENNMS_TSID_NODE_ID: "17"
    ports:
      - "8180:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  perspectivepollerd:
    profiles: [full]
    image: ${IMAGE_PREFIX:-opennms}/perspectivepollerd:${VERSION}
    container_name: delta-v-perspectivepollerd
    hostname: perspectivepollerd
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      JAVA_OPTS: "-Xms512m -Xmx1g -XX:MaxMetaspaceSize=256m -Dorg.opennms.core.ipc.rpc.force-remote=true"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/opennms
      SPRING_DATASOURCE_USERNAME: opennms
      SPRING_DATASOURCE_PASSWORD: opennms
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: opennms-perspectivepollerd
      OPENNMS_HOME: /opt/deltav
      OPENNMS_INSTANCE_ID: OpenNMS
      OPENNMS_TSID_NODE_ID: "7"
      OPENNMS_RPC_KAFKA_ENABLED: "true"
      OPENNMS_RPC_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./perspectivepollerd-overlay/etc:/opt/deltav/etc:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  alarmd:
    profiles: [lite, passive, full]
    image: ${IMAGE_PREFIX:-opennms}/alarmd:${VERSION}
    container_name: delta-v-alarmd
    hostname: alarmd
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      JAVA_OPTS: "-Xms512m -Xmx1g -XX:MaxMetaspaceSize=256m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/opennms
      SPRING_DATASOURCE_USERNAME: opennms
      SPRING_DATASOURCE_PASSWORD: opennms
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: opennms-alarmd
      OPENNMS_HOME: /opt/deltav
      OPENNMS_INSTANCE_ID: OpenNMS
      OPENNMS_TSID_NODE_ID: "23"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  telemetryd:
    profiles: [full]
    image: ${IMAGE_PREFIX:-opennms}/telemetryd:${VERSION}
    container_name: delta-v-telemetryd
    hostname: telemetryd
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:MaxMetaspaceSize=256m -Dorg.opennms.core.ipc.sink.kafka.bootstrap.servers=kafka:9092 -Dorg.opennms.core.ipc.sink.kafka.group.id=opennms-telemetryd-sink -Dorg.opennms.core.ipc.twin.kafka.bootstrap.servers=kafka:9092"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/opennms
      SPRING_DATASOURCE_USERNAME: opennms
      SPRING_DATASOURCE_PASSWORD: opennms
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: opennms-telemetryd
      OPENNMS_HOME: /opt/deltav
      OPENNMS_INSTANCE_ID: OpenNMS
      OPENNMS_TSID_NODE_ID: "18"
    volumes:
      - ./telemetryd-overlay/etc:/opt/deltav/etc:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  clickhouse:
    profiles: [full]
    image: clickhouse/clickhouse-server:25.8
    container_name: delta-v-clickhouse
    hostname: clickhouse
    restart: unless-stopped
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    environment:
      CLICKHOUSE_DB: deltav
      CLICKHOUSE_USER: deltav
      CLICKHOUSE_PASSWORD: deltav
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ../../core/flow-enricher/src/main/proto:/opt/clickhouse/format_schemas
      - ./clickhouse/config.d/format-schema-path.xml:/etc/clickhouse-server/config.d/format-schema-path.xml:ro
    ports:
      - "8123:8123"
      - "9000:9000"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  clickhouse-init:
    profiles: [full]
    image: clickhouse/clickhouse-server:25.8
    container_name: delta-v-clickhouse-init
    hostname: clickhouse-init
    restart: "no"
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: deltav
      CLICKHOUSE_PASSWORD: deltav
      DELTAV_CLICKHOUSE_FLOWS_RAW_TTL_DAYS: "14"
      DELTAV_CLICKHOUSE_FLOWS_AGG_TTL_DAYS: "90"
    volumes:
      - ./clickhouse/init:/delta-v/init:ro
      - ./clickhouse/user-init:/delta-v/user-init:ro
      - ./clickhouse/init-runner.sh:/usr/local/bin/init-runner.sh:ro
      - ../../core/flow-enricher/src/main/proto:/delta-v/proto:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/init-runner.sh"]

  flow-enricher:
    profiles: [full]
    image: ${IMAGE_PREFIX:-opennms}/flow-enricher:${VERSION}
    container_name: delta-v-flow-enricher
    hostname: flow-enricher
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:MaxMetaspaceSize=256m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/opennms
      SPRING_DATASOURCE_USERNAME: opennms
      SPRING_DATASOURCE_PASSWORD: opennms
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Sink topic prefix is OpenNMS.* until the DeltaV.* rename PR lands.
      DELTAV_FLOWS_SINK_TOPICS: "OpenNMS.Sink.Telemetry-Netflow-5,OpenNMS.Sink.Telemetry-Netflow-9,OpenNMS.Sink.Telemetry-IPFIX,OpenNMS.Sink.Telemetry-SFlow"
      DELTAV_FLOWS_OUTPUT_TOPIC: deltav-flows
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  flow-default-testnode-1:
    profiles: [full]
    build: ./flow-exporter
    container_name: flow-default-testnode-1
    hostname: flow-default-testnode-1
    cap_add:
      - NET_RAW
    depends_on:
      minion:
        condition: service_healthy
    environment:
      NETFLOW_COLLECTOR: minion:4729
      NETFLOW_VERSION: "9"
      TRAFFIC_INTERVAL: "5"

  flow-sflow-testnode-1:
    profiles: [full]
    build: ./sflow-exporter
    container_name: flow-sflow-testnode-1
    hostname: flow-sflow-testnode-1
    cap_add:
      - NET_RAW
    depends_on:
      minion:
        condition: service_healthy
    environment:
      SFLOW_COLLECTOR: minion:4729
      # sampling=1 means sample every packet — necessary for a low-traffic
      # test bed. polling=10 emits counter samples every 10s.
      SAMPLING_RATE: "1"
      POLLING_INTERVAL: "10"
      TRAFFIC_INTERVAL: "2"

  prometheus-writer:
    image: opennms/prometheus-writer:${ONMS_DELTAV_VERSION:-latest}
    profiles: [lite, full, metrics]
    depends_on:
      kafka:
        condition: service_healthy
      provisiond:
        condition: service_started
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PROMETHEUS_WRITER_REMOTE_WRITE_URL: http://victoriametrics:8428/api/v1/write
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "18080:8080"

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.106.1
    profiles: [metrics, metrics-e2e]
    command:
      # VM v1.106.1 rejects retentionPeriod smaller than 1 day; "1h" causes
      # exit code 255 at startup with fatal log:
      #   -retentionPeriod cannot be smaller than a day; got 1h
      # E2E only needs a few minutes of retention, but the floor is 1d.
      - "-retentionPeriod=1d"
      - "-storageDataPath=/tmp/vm"
      - "-search.latencyOffset=1s"
    healthcheck:
      # Use 127.0.0.1 — BusyBox wget resolves "localhost" to ::1 first, but
      # VM listens on 0.0.0.0:8428 (IPv4 only), so localhost fails Connection
      # refused. 127.0.0.1 forces IPv4 and matches the listening socket.
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8428/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "18428:8428"

  grafana:
    image: grafana/grafana:11.4.0
    profiles: [metrics, metrics-e2e]
    container_name: delta-v-grafana
    hostname: grafana
    depends_on:
      victoriametrics:
        condition: service_healthy
    environment:
      # Anonymous read-only access for demo. Anyone hitting localhost:13000 lands
      # in the Viewer role without login. Disable by setting GF_AUTH_ANONYMOUS_ENABLED=false.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      # Admin password override. Default 'admin' is fine for the demo stack.
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      # Disable telemetry phone-home and update checks — this is a demo container.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    healthcheck:
      # Use 127.0.0.1 (not localhost) — BusyBox wget in the Grafana base
      # image resolves localhost to ::1 first, but Grafana listens on IPv4 by
      # default. Same fix as the victoriametrics healthcheck above.
      # The grep pattern uses "database.*ok" because Grafana's JSON response
      # is pretty-printed with a space after the colon ("database": "ok"),
      # not the compact form expected by some other Grafana healthcheck examples.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health | grep -q 'database.*ok'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    ports:
      - "13000:3000"

volumes:
  pgdata:
  kafkadata:
  collectd-data:
  clickhouse-data:
  grafanadata:
