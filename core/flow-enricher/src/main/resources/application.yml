spring:
  application:
    name: flow-enricher
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}  # bootstrap consumer needs this; binder brokers alone do NOT satisfy a plain spring.kafka property — #170 lesson
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/deltav}
    username: ${SPRING_DATASOURCE_USERNAME:deltav}
    password: ${SPRING_DATASOURCE_PASSWORD:deltav}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  cloud:
    function:
      definition: enrichFlows
    stream:
      bindings:
        # Multi-topic input: comma-separated destinations let one binding
        # consume from all four flow Sink topics in parallel. Operators can
        # override the whole list via DELTAV_FLOWS_SINK_TOPICS.
        enrichFlows-in-0:
          destination: ${DELTAV_FLOWS_SINK_TOPICS:DeltaV.Sink.Telemetry-Netflow-5,DeltaV.Sink.Telemetry-Netflow-9,DeltaV.Sink.Telemetry-IPFIX,DeltaV.Sink.Telemetry-SFlow}
          group: deltav-flow-enricher
          consumer:
            auto-startup: false
        enrichFlows-out-0:
          destination: ${DELTAV_FLOWS_OUTPUT_TOPIC:deltav-flows}
          # The function returns a List<byte[]> where each element is an
          # already-serialized FlowDocument protobuf. useNativeEncoding=true
          # tells Spring Cloud Function not to JSON-wrap the payload, which
          # also lets the binder treat the List as a splitter (one Kafka
          # record per list element) instead of a single JSON array.
          producer:
            use-native-encoding: true
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
          auto-create-topics: true
        bindings:
          enrichFlows-in-0:
            consumer:
              configuration:
                partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

deltav:
  flows:
    interface-marking:
      cache-ttl: ${DELTAV_FLOWS_INTERFACE_MARKING_CACHE_TTL:24h}
      clean-interval-ms: ${DELTAV_FLOWS_INTERFACE_MARKING_CLEAN_INTERVAL_MS:3600000}
    parser:
      system-id: flow-enricher
      location: Default
    # Reverse-DNS enrichment of flow IPs (src/dst/etc -> *_hostname). ON by default
    # (Horizon parity). Backed by horizon's NettyDnsResolver (circuit breaker +
    # bulkhead + TTL cache + timeout). For high-cardinality internet-facing flows,
    # set scope=private or lower query-timeout-ms, or disable entirely.
    dns:
      enabled: ${DELTAV_FLOWS_DNS_ENABLED:true}
      scope: ${DELTAV_FLOWS_DNS_SCOPE:all}            # all | private
      nameservers: ${DELTAV_FLOWS_DNS_NAMESERVERS:}   # blank = system resolv.conf
      query-timeout-ms: ${DELTAV_FLOWS_DNS_QUERY_TIMEOUT_MS:5000}
      max-concurrent: ${DELTAV_FLOWS_DNS_MAX_CONCURRENT:1000}
      cache:
        min-ttl-s: ${DELTAV_FLOWS_DNS_CACHE_MIN_TTL_S:-1}
        max-ttl-s: ${DELTAV_FLOWS_DNS_CACHE_MAX_TTL_S:-1}
        negative-ttl-s: ${DELTAV_FLOWS_DNS_CACHE_NEGATIVE_TTL_S:-1}
      circuit-breaker:
        enabled: ${DELTAV_FLOWS_DNS_BREAKER_ENABLED:true}
        failure-rate-threshold: ${DELTAV_FLOWS_DNS_BREAKER_FAILURE_RATE:80}

logging:
  level:
    org.deltav: INFO
    org.opennms: INFO
    org.springframework.cloud.stream: INFO
