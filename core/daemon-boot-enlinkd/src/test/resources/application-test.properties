# Hibernate auto-generates the schema for the IT — avoids maintaining a
# separate enlinkd-it.sql alongside the production schema. Test fixtures are
# inserted via EntityManager, so we don't need DDL parity with production.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Topology cache TTL is irrelevant for DAO-only IT; pick something fast for
# safety in case the test ever exercises cache behavior end-to-end.
deltav.enlinkd.topology-cache.duration-seconds=1

# Allow TestConfig @Bean definitions to override production beans (e.g. eventIpcManager,
# snmpAgentConfigFactory). This is safe in tests where we want mocks to shadow
# the Kafka/file-loading beans defined in the production @Configuration classes.
spring.main.allow-bean-definition-overriding=true

# Disable Kafka RPC client factory — no Minion in IT context.
# KafkaRpcClientConfiguration defaults to enabled=true in application.yml;
# override here so ConditionalOnProperty skips it and TestConfig supplies the mock.
opennms.rpc.kafka.enabled=false
