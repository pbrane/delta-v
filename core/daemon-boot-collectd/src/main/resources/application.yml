spring:
  application:
    name: collectd
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/deltav}
    username: ${SPRING_DATASOURCE_USERNAME:deltav}
    password: ${SPRING_DATASOURCE_PASSWORD:deltav}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate.archive.autodetection: none
  # Spring Kafka's KafkaAdmin (which provisions the NewTopic beans in
  # TimeseriesKafkaPublisherConfiguration) binds to spring.kafka.bootstrap-servers.
  # Without this, KafkaAdmin defaults to localhost:9092 and spins endlessly trying
  # to reach a broker — the SCS binder's `brokers` property is consumed by the
  # binder itself, not by the KafkaAdmin auto-configuration.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
  cloud:
    stream:
      bindings:
        publishTimeseries-out-0:
          destination: deltav-timeseries
          producer:
            partition-count: ${DELTAV_TIMESERIES_PARTITIONS:16}
            use-native-encoding: true
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
          auto-create-topics: true
        bindings:
          publishTimeseries-out-0:
            producer:
              configuration:
                key.serializer: org.apache.kafka.common.serialization.ByteArraySerializer
                value.serializer: org.apache.kafka.common.serialization.ByteArraySerializer
                compression.type: lz4
                linger.ms: 50
                batch.size: 65536
                acks: all
                enable.idempotence: true
                max.in.flight.requests.per.connection: 5

opennms:
  home: ${OPENNMS_HOME:/opt/deltav}
  instance:
    id: ${OPENNMS_INSTANCE_ID:OpenNMS}
  tsid:
    node-id: ${OPENNMS_TSID_NODE_ID:0}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    event-topic: ${KAFKA_EVENT_TOPIC:deltav-fault-events}
    ipc-topic: ${KAFKA_IPC_TOPIC:deltav-ipc-events}
    consumer-group: ${KAFKA_CONSUMER_GROUP:opennms-collectd}
    poll-timeout-ms: ${KAFKA_POLL_TIMEOUT_MS:100}
  rpc:
    kafka:
      enabled: ${OPENNMS_RPC_KAFKA_ENABLED:true}
      bootstrap-servers: ${OPENNMS_RPC_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
      # SnmpCollector runs locally (getEffectiveLocation returns "Default") and
      # uses LocationAwareSnmpClient to proxy SNMP walks to the remote Minion.
      # force-remote must be false so the Collect RPC executes in-process.
      force-remote: ${OPENNMS_RPC_KAFKA_FORCE_REMOTE:false}
  timeseries:
    strategy: ${OPENNMS_TIMESERIES_STRATEGY:inmemory}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, conditions
  metrics:
    tags:
      application: ${spring.application.name:collectd}

deltav:
  timeseries:
    enabled: ${DELTAV_TIMESERIES_ENABLED:false}
    partitions: ${DELTAV_TIMESERIES_PARTITIONS:16}
    replication-factor: ${DELTAV_TIMESERIES_REPLICATION_FACTOR:1}
    retention-days: ${DELTAV_TIMESERIES_RETENTION_DAYS:1}
  node-context:
    partitions: ${DELTAV_NODE_CONTEXT_PARTITIONS:8}
    replication-factor: ${DELTAV_NODE_CONTEXT_REPLICATION_FACTOR:1}
