// API version: 1 (FROZEN at Phase 2 GA — delta-v#174)
//
// Public contract for the deltav-node-context Kafka topic.
//
// Versioning: this wire format is frozen as of Phase 2 GA. Only
// forward-compatible changes are permitted: new fields with new tag
// numbers, new enum values appended at the end. Renaming or renumbering
// existing fields, deleting fields, or changing field types are breaking
// changes that require bumping to // API version: 2 with a one-release
// deprecation cycle maintaining v1 as read-only.
//
// Producer: provisiond change feed (future PR). This file is committed in
// the Kafka Time Series producer PR for contract completeness and to allow
// the NewTopic bean for deltav-node-context to be declared alongside the
// deltav-timeseries topic.

syntax = "proto3";

package org.deltav.timeseries;

option java_package = "org.deltav.timeseries.proto";
option java_multiple_files = true;

// One record per node, published to the deltav-node-context topic whenever a
// node is provisioned, updated, deleted, or its metadata changes. The topic is
// compacted (log.cleanup.policy=compact), so the latest record per key
// survives forever and a new consumer can bootstrap from the beginning of the
// topic to materialize the full current state.
//
// Keyed by "{location}@{node_id}" — same key shape as TimeseriesBatch so
// consumers can join directly without a key transformer.
message NodeContext {
  // Numeric node ID. Matches TimeseriesBatch.node_id.
  int32 node_id = 1;

  // Location. Matches TimeseriesBatch.location.
  string location = 2;

  // Human-readable node label as displayed in the UI (e.g.
  // "server-01.prod.example.com"). Comes from OnmsNode.label.
  string node_label = 3;

  // Provisioning foreign source (e.g. "provision-prod"). Empty if the
  // node was not created via provisioning.
  string foreign_source = 4;

  // Provisioning foreign ID (e.g. "server-01"). Stable identifier for
  // this node within its foreign source.
  string foreign_id = 5;

  // Categories assigned to the node. Typically 0-5 entries.
  repeated string categories = 6;

  // Full metadata map for the node. Keys follow OnmsMetaData convention:
  // "context:key" (e.g. "requisition:sysLocation", "snmp:sysContact",
  // "ip:hostname"). Values are whatever provisiond or SNMP discovery
  // populated. Can be large — hundreds of entries for heavily-metadataed
  // nodes is not unusual.
  //
  // Consumer responsibility: metadata values should be used as-is; don't
  // attempt to parse or reinterpret them. If a consumer needs to filter
  // by a metadata value, it filters on the string.
  map<string, string> metadata = 7;

  // Interface-level metadata, keyed by IP address (IPv4 or IPv6 string).
  // For nodes with many interfaces this can grow — each entry carries
  // its own metadata map. Empty map is a valid value meaning "no
  // interface-scoped metadata for this node."
  map<string, InterfaceContext> interface_metadata = 8;

  // Service-level metadata, keyed by "{ip_address}/{service_name}" for
  // stable uniqueness (e.g. "192.0.2.1/ICMP").
  map<string, ServiceContext> service_metadata = 9;

  // Wall-clock time when this record was produced, in epoch milliseconds.
  // Consumers use this for freshness checks. Strictly informational —
  // the topic's log compaction determines which record wins per key, not
  // this timestamp.
  int64 updated_at_ms = 10;

  // Tombstone marker. When a node is deleted from provisioning, provisiond
  // publishes a final NodeContext with deleted=true, allowing log
  // compaction to eventually garbage-collect the key. Consumers should
  // treat a tombstoned node as "not present."
  bool deleted = 11;

  // SNMP (physical) interface table, keyed by ifIndex. Sourced from
  // OnmsNode.getSnmpInterfaces(). Distinct from interface_metadata (field 8),
  // which is keyed by IP address — SNMP interfaces are physical ports keyed by
  // the integer ifIndex, IP interfaces are L3 addresses. Empty map is valid
  // and means "no SNMP interfaces discovered for this node."
  map<int32, SnmpInterfaceContext> snmp_interface_metadata = 12;
}

// Interface-scoped metadata. Carried as a nested message so the map value
// in NodeContext.interface_metadata can hold both a metadata map and any
// future interface-level fields without schema churn.
message InterfaceContext {
  map<string, string> metadata = 1;
  // Future: interface description, interface alias, snmp_ifindex, etc.
  // Leaving space open (fields 2+) for incremental additions.
}

// Service-scoped metadata. Same structure as InterfaceContext.
message ServiceContext {
  map<string, string> metadata = 1;
  // Future: service-level display name, criticality hint, etc.
}

// SNMP (physical) interface — keyed by ifIndex in
// NodeContext.snmp_interface_metadata. Carries the physical-interface
// attributes consumers need to label SNMP-interface metrics and alarms
// (ifName/ifDescr/ifAlias/ifSpeed/ifType). Sourced from OnmsSnmpInterface.
message SnmpInterfaceContext {
  // SNMP ifIndex. Matches the map key and OnmsSnmpInterface.getIfIndex().
  int32 if_index = 1;

  // ifName (e.g. "Gi0/3"). From OnmsSnmpInterface.getIfName().
  string if_name = 2;

  // ifDescr (e.g. "GigabitEthernet0/3"). From OnmsSnmpInterface.getIfDescr().
  string if_descr = 3;

  // ifAlias — operator-assigned interface description. From getIfAlias().
  string if_alias = 4;

  // ifSpeed in bits/sec. From OnmsSnmpInterface.getIfSpeed(); 0 when unknown.
  int64 if_speed = 5;

  // IANA ifType. From OnmsSnmpInterface.getIfType(); 0 when unknown.
  int32 if_type = 6;

  // Physical (MAC) address. From OnmsSnmpInterface.getPhysAddr().
  string physical_address = 7;
}
