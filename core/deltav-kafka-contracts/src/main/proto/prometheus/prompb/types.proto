// Vendored into delta-v for use by the prometheus-writer Remote Write client.
// Source: github.com/prometheus/prometheus/prompb/types.proto (Apache-2.0)
// Snapshot taken 2026-04-17 from upstream prompb/main. NOTE: this is a
// subset of upstream — the native-histogram fields (Histogram message,
// TimeSeries.histograms) are intentionally omitted because Phase 2 does
// not emit them. When upgrading, diff against the same upstream commit
// to identify additions; do not re-derive a snapshot version.

syntax = "proto3";
package prometheus;

option go_package = "github.com/prometheus/prometheus/prompb";
option java_package = "prometheus.prompb";
option java_multiple_files = true;

message MetricMetadata {
  enum MetricType {
    UNKNOWN        = 0;
    COUNTER        = 1;
    GAUGE          = 2;
    HISTOGRAM      = 3;
    GAUGEHISTOGRAM = 4;
    SUMMARY        = 5;
    INFO           = 6;
    STATESET       = 7;
  }

  MetricType type = 1;
  string metric_family_name = 2;
  string help = 4;
  string unit = 5;
}

message Sample {
  double value    = 1;
  int64 timestamp = 2;
}

message Exemplar {
  repeated Label labels = 1;
  double value          = 2;
  int64 timestamp       = 3;
}

message TimeSeries {
  repeated Label labels      = 1;
  repeated Sample samples    = 2;
  repeated Exemplar exemplars = 3;
}

message Label {
  string name  = 1;
  string value = 2;
}

message Labels {
  repeated Label labels = 1;
}

message LabelMatcher {
  enum Type {
    EQ  = 0;
    NEQ = 1;
    RE  = 2;
    NRE = 3;
  }
  Type type    = 1;
  string name  = 2;
  string value = 3;
}

message ReadHints {
  int64 step_ms   = 1;
  string func     = 2;
  int64 start_ms  = 3;
  int64 end_ms    = 4;
  repeated string grouping = 5;
  bool by         = 6;
  int64 range_ms  = 7;
}

message Chunk {
  int64 min_time_ms = 1;
  int64 max_time_ms = 2;

  enum Encoding {
    UNKNOWN = 0;
    XOR     = 1;
    HISTOGRAM = 2;
    FLOAT_HISTOGRAM = 3;
  }
  Encoding type = 3;
  bytes data    = 4;
}

message ChunkedSeries {
  repeated Label labels = 1;
  repeated Chunk chunks = 2;
}
