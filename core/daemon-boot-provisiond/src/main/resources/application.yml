spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/deltav}
    username: ${SPRING_DATASOURCE_USERNAME:deltav}
    password: ${SPRING_DATASOURCE_PASSWORD:deltav}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate.archive.autodetection: none
    open-in-view: false

  quartz:
    job-store-type: memory
    scheduler-name: provisiond

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

  cloud:
    stream:
      bindings:
        publishNodeContext-out-0:
          destination: deltav-node-context
          producer:
            partition-count: ${DELTAV_NODE_CONTEXT_PARTITIONS:8}
            use-native-encoding: true
      kafka:
        bindings:
          publishNodeContext-out-0:
            producer:
              configuration:
                key.serializer: org.apache.kafka.common.serialization.ByteArraySerializer
                value.serializer: org.apache.kafka.common.serialization.ByteArraySerializer
                compression.type: lz4
                linger.ms: 50
                batch.size: 32768
                acks: all
                enable.idempotence: true
                max.in.flight.requests.per.connection: 5

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always

opennms:
  home: ${OPENNMS_HOME:/opt/deltav}
  instance:
    id: ${OPENNMS_INSTANCE_ID:OpenNMS}
  tsid:
    node-id: ${OPENNMS_TSID_NODE_ID:25}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    event-topic: ${KAFKA_EVENT_TOPIC:deltav-fault-events}
    consumer-group: ${KAFKA_CONSUMER_GROUP:opennms-provisiond}
    poll-timeout-ms: ${KAFKA_POLL_TIMEOUT_MS:100}
  rpc:
    kafka:
      enabled: ${RPC_KAFKA_ENABLED:true}
      bootstrap-servers: ${RPC_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
      force-remote: ${RPC_KAFKA_FORCE_REMOTE:true}

deltav:
  node-context:
    enabled: ${DELTAV_NODE_CONTEXT_ENABLED:true}
    partitions: ${DELTAV_NODE_CONTEXT_PARTITIONS:8}
    replication-factor: ${DELTAV_NODE_CONTEXT_REPLICATION_FACTOR:1}
    debounce-ms: ${DELTAV_NODE_CONTEXT_DEBOUNCE_MS:250}
    debounce-threads: ${DELTAV_NODE_CONTEXT_DEBOUNCE_THREADS:2}

logging:
  level:
    org.opennms: INFO
    org.opennms.netmgt.provision: DEBUG
    org.opennms.netmgt.provision.service.lifecycle: DEBUG
    org.opennms.core.tasks: DEBUG
