admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
  - name: minion_grpc_listener
    address:
      socket_address: { address: 0.0.0.0, port_value: 8443 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          codec_type: HTTP2
          stat_prefix: minion_grpc
          stream_idle_timeout: 0s        # long-lived streams, no idle timeout
          route_config:
            name: minion_grpc_routes
            virtual_hosts:
            - name: minion_grpc
              domains: ["*"]
              routes:
              - match:
                  prefix: "/org.deltav.minion.grpc.v1.HeartbeatService/"
                  grpc: {}
                route:
                  cluster: minion_gateway
                  timeout: 0s            # streaming RPCs, no per-call timeout
              # v1.2.0-rc2 PR1: RPC channel migration. Adds routing for the new
              # RpcChannelService bidi stream used by gateway-side dispatcher
              # (Decision 1 Option D). Future PRs (sinks, twin) will add their
              # own per-service routes here as they migrate.
              - match:
                  prefix: "/org.deltav.minion.grpc.v1.RpcChannelService/"
                  grpc: {}
                route:
                  cluster: minion_gateway
                  timeout: 0s            # streaming RPCs, no per-call timeout
              # v1.2.0-rc2 PR2: Twin channel migration. Adds routing for the new
              # TwinChannelService bidi stream used by gateway-side broadcaster.
              - match:
                  prefix: "/org.deltav.minion.grpc.v1.TwinChannelService/"
                  grpc: {}
                route:
                  cluster: minion_gateway
                  timeout: 0s            # streaming RPCs, no per-call timeout
              # v1.2.0-rc2 PR3: Sink channel migration. Adds routing for the
              # three new sink bidi services (Syslog, Trap, Telemetry) used by
              # gateway-side translators. Without these prefix matches, Minion
              # gets UNIMPLEMENTED on first stream open (PR1 Phase 4 lesson).
              - match:
                  prefix: "/org.deltav.minion.grpc.v1.SyslogService/"
                  grpc: {}
                route:
                  cluster: minion_gateway
                  timeout: 0s            # streaming RPCs, no per-call timeout
              - match:
                  prefix: "/org.deltav.minion.grpc.v1.TrapService/"
                  grpc: {}
                route:
                  cluster: minion_gateway
                  timeout: 0s            # streaming RPCs, no per-call timeout
              - match:
                  prefix: "/org.deltav.minion.grpc.v1.TelemetryService/"
                  grpc: {}
                route:
                  cluster: minion_gateway
                  timeout: 0s            # streaming RPCs, no per-call timeout
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: minion_gateway
    connect_timeout: 5s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    # STRICT_DNS polls for endpoint changes — kept (not LOGICAL_DNS) so v1.3's
    # multi-instance minion-gateway scale-out (Decision 7) is supported without
    # config churn. But default settings are too aggressive for our use:
    #   - dns_lookup_family AUTO does both A and AAAA every poll. The Docker
    #     embedded resolver has no AAAA for in-network names, so AAAA forwards
    #     to the host's resolver. If the host's /etc/resolv.conf has a `search`
    #     domain (typical on a home network), Envoy ends up querying e.g.
    #     `minion-gateway.homenet.example. AAAA` against the operator's ISP DNS,
    #     which times out (5s) when that DNS flakes. Repeated failures briefly
    #     mark the cluster as resolution-stale and stall both Minions' streams.
    #     V4_ONLY skips the AAAA branch entirely. Docker bridge networks are
    #     IPv4-only by default, so this loses no functionality.
    #   - dns_refresh_rate defaults to 5s, which is overkill for a single
    #     upstream that only changes during deploys. 30s reduces DNS chatter
    #     6× without affecting failover latency for any realistic scenario.
    dns_lookup_family: V4_ONLY
    dns_refresh_rate: 30s
    http2_protocol_options: {}            # h2c upstream
    load_assignment:
      cluster_name: minion_gateway
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: minion-gateway, port_value: 9090 }
