name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Java JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Configure Maven for GitHub Packages
        # HORIZON_READ_TOKEN is a PAT with read:packages scope. GITHUB_TOKEN is not
        # sufficient: the horizon BOM and the opennms-ipc-contract artifact live on
        # different repos owned by the same user, and cross-repo GitHub Packages reads
        # via GITHUB_TOKEN are not granted by default. GitHub Packages Maven also
        # requires auth even for public repos, so opennms-ipc-contract needs a server too.
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << SETTINGS
          <settings>
            <servers>
              <server>
                <id>github-deltav-horizon</id>
                <username>${GITHUB_REPOSITORY_OWNER}</username>
                <password>${PACKAGES_TOKEN}</password>
              </server>
              <server>
                <id>github-deltav-ipc-contract</id>
                <username>${GITHUB_REPOSITORY_OWNER}</username>
                <password>${PACKAGES_TOKEN}</password>
              </server>
            </servers>
          </settings>
          SETTINGS
        env:
          PACKAGES_TOKEN: ${{ secrets.HORIZON_READ_TOKEN }}

      - name: Build all modules
        run: ./mvnw -B -DskipTests install
