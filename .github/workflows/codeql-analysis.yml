name: "CodeQL"

on:
  push:
    branches: [ "main", "develop" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
  pull_request:
    branches: [ "main", "develop" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
  schedule:
    - cron: '20 5 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # Delta-V is pure Java/Kotlin — the legacy webapp (opennms-webapp)
        # and Vue UI (ui/) were removed in #28 and subsequent cleanups.
        # Running the javascript-typescript extractor here produced a hard
        # failure on every PR ("CodeQL detected code written in Java/Kotlin
        # and GitHub Actions, but not any written in JavaScript/TypeScript").
        # When JS/TS source returns to this repo, re-add the language here.
        language: [ 'java-kotlin' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0

    - name: Set up Java JDK
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
      with:
        java-version: '21'
        distribution: temurin
        cache: maven

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: security-extended,security-and-quality

    - name: Configure Maven for GitHub Packages
      run: |
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml << SETTINGS
        <settings>
          <servers>
            <server>
              <id>github-deltav-horizon</id>
              <username>${GITHUB_ACTOR}</username>
              <password>${PACKAGES_TOKEN}</password>
            </server>
          </servers>
        </settings>
        SETTINGS
      env:
        PACKAGES_TOKEN: ${{ secrets.HORIZON_READ_TOKEN }}

    - name: Build all modules (Java)
      run: ./mvnw -B -DskipTests install

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
