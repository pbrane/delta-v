# Delta-V Build & Push Images
#
# Builds all Delta-V Docker images (28 total) and pushes them to GitHub
# Container Registry (GHCR) as multi-arch images (linux/amd64 + linux/arm64).
#
# Trigger: Push a tag matching 'v*' (e.g., v1.1.0)
#          or run manually via workflow_dispatch.
#
# Images built:
#   Base layers:
#     - ghcr.io/<owner>/jre-deltav:21          Custom JRE (jlink, Alpine)
#     - ghcr.io/<owner>/daemon-base:<version>  Shared libs for all daemons
#
#   Daemons (12 Spring Boot fat JARs sharing daemon-base):
#     - ghcr.io/<owner>/alarmd:<version>
#     - ghcr.io/<owner>/bsmd:<version>
#     - ghcr.io/<owner>/collectd:<version>
#     - ghcr.io/<owner>/discovery:<version>
#     - ghcr.io/<owner>/enlinkd:<version>
#     - ghcr.io/<owner>/eventtranslator:<version>
#     - ghcr.io/<owner>/perspectivepollerd:<version>
#     - ghcr.io/<owner>/pollerd:<version>
#     - ghcr.io/<owner>/provisiond:<version>
#     - ghcr.io/<owner>/syslogd:<version>
#     - ghcr.io/<owner>/telemetryd:<version>
#     - ghcr.io/<owner>/trapd:<version>
#
#   Infrastructure:
#     - ghcr.io/<owner>/alerts-forwarder:<version>         Alarm → Alertmanager forwarder
#     - ghcr.io/<owner>/alarms-materializer:<version>      Kafka alarms state-change → Postgres view
#     - ghcr.io/<owner>/minion-boot:<version>              Spring Boot Minion
#     - ghcr.io/<owner>/minion-gateway:<version>           gRPC ingress translator (Minion → Kafka)
#     - ghcr.io/<owner>/envoy:<version>                    gRPC ingress in front of minion-gateway
#     - ghcr.io/<owner>/db-init:<version>                  Liquibase schema migration
#     - ghcr.io/<owner>/flow-enricher:<version>            Flow decode + enrich → ClickHouse
#     - ghcr.io/<owner>/prometheus-writer:<version>        Metrics → Prometheus Remote Write
#     - ghcr.io/<owner>/clickhouse:<version>               ClickHouse server + baked config.d / format schemas
#     - ghcr.io/<owner>/clickhouse-init:<version>          One-shot DDL bootstrap sidecar
#     - ghcr.io/<owner>/grafana:<version>                  Grafana + baked provisioning / dashboards
#     - ghcr.io/<owner>/provisiond-imports-init:<version>  Seeds requisitions named volume on first boot
#     - ghcr.io/<owner>/perspective-app-init:<version>     Seeds smoke-baseline perspective application
#     - ghcr.io/<owner>/l8opensim-provisioner:<version>    POSTs 20-device seed to l8opensim
#     - ghcr.io/<owner>/mock-snmp-agent:<version>          Mock SNMP agent (test infra)
#     - ghcr.io/<owner>/flow-exporter:<version>            NetFlow v5/v9 test-node exporter
#     - ghcr.io/<owner>/sflow-exporter:<version>           sFlow test-node exporter (hsflowd)
#
# Usage after build:
#   1. Set IMAGE_PREFIX in opennms-container/delta-v/.env:
#        IMAGE_PREFIX=ghcr.io/<owner>
#
#   2. Authenticate to GHCR (one-time):
#        echo $GITHUB_TOKEN | docker login ghcr.io -u <username> --password-stdin
#
#   3. Pull and deploy:
#        cd opennms-container/delta-v
#        docker compose pull
#        ./deploy.sh up lite    # or passive, full
#
#   4. Verify:
#        ./deploy.sh status
#        ./deploy.sh test

name: Delta-V Build & Push Images

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
  JAVA_VERSION: '21'
  PLATFORMS: linux/amd64,linux/arm64

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Delta-V Images
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Configure Maven for GitHub Packages
        # HORIZON_READ_TOKEN is a PAT with read:packages scope on pbrane/delta-v-horizon.
        # GITHUB_TOKEN is not sufficient here (cross-repo packages access isn't granted
        # by default, even when the source and target repos have the same owner).
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << SETTINGS
          <settings>
            <servers>
              <server>
                <id>github-deltav-horizon</id>
                <username>${GITHUB_REPOSITORY_OWNER}</username>
                <password>${PACKAGES_TOKEN}</password>
              </server>
            </servers>
          </settings>
          SETTINGS
        env:
          PACKAGES_TOKEN: ${{ secrets.HORIZON_READ_TOKEN }}

      - name: Extract version from POM
        id: version
        run: |
          VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compile all modules
        run: ./mvnw -B -DskipTests install

      - name: Build and push JRE base image
        working-directory: opennms-container/delta-v
        run: |
          docker buildx build \
            --platform ${{ env.PLATFORMS }} \
            -f Dockerfile.jre \
            -t "${{ env.IMAGE_PREFIX }}/jre-deltav:21" \
            -t "${{ env.IMAGE_PREFIX }}/jre-deltav:latest" \
            --push \
            .

      - name: Stage and deduplicate daemon JARs
        working-directory: opennms-container/delta-v
        run: ./compute-shared-libs.sh "${{ github.workspace }}" "${{ steps.version.outputs.version }}"

      - name: Build and push daemon-base image
        working-directory: opennms-container/delta-v
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx build --no-cache \
            --platform ${{ env.PLATFORMS }} \
            -f Dockerfile.daemon-base \
            --build-arg "JRE_IMAGE=${{ env.IMAGE_PREFIX }}/jre-deltav:21" \
            -t "${{ env.IMAGE_PREFIX }}/daemon-base:${VERSION}" \
            -t "${{ env.IMAGE_PREFIX }}/daemon-base:latest" \
            --push \
            .

      - name: Build and push per-daemon images
        working-directory: opennms-container/delta-v
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          DAEMONS="alarmd bsmd collectd discovery enlinkd eventtranslator perspectivepollerd pollerd provisiond syslogd telemetryd trapd"
          for name in $DAEMONS; do
            MAIN_CLASS=$(cat "staging/$name/.main_class")
            echo "==> Building $name (main: $MAIN_CLASS)..."
            docker buildx build \
              --platform ${{ env.PLATFORMS }} \
              -f Dockerfile.daemon-per \
              --build-arg "VERSION=${VERSION}" \
              --build-arg "DAEMON_BASE_IMAGE=${{ env.IMAGE_PREFIX }}/daemon-base" \
              --build-arg "DAEMON_NAME=$name" \
              --build-arg "MAIN_CLASS=$MAIN_CLASS" \
              -t "${{ env.IMAGE_PREFIX }}/$name:${VERSION}" \
              -t "${{ env.IMAGE_PREFIX }}/$name:latest" \
              --push \
              .
          done

      - name: Stage and build Minion Boot image
        working-directory: opennms-container/delta-v
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p staging/minion-boot
          find "${{ github.workspace }}/core/daemon-boot-minion/target" \
            -maxdepth 1 -name "*.jar" \
            ! -name "*-sources.jar" ! -name "*-javadoc.jar" ! -name "*.original" \
            -exec cp {} staging/minion-boot/daemon-boot-minion.jar \;
          docker buildx build \
            --platform ${{ env.PLATFORMS }} \
            --build-arg "VERSION=${VERSION}" \
            --build-arg "JRE_IMAGE=${{ env.IMAGE_PREFIX }}/jre-deltav:21" \
            -f Dockerfile.minion-boot \
            -t "${{ env.IMAGE_PREFIX }}/minion-boot:${VERSION}" \
            -t "${{ env.IMAGE_PREFIX }}/minion-boot:latest" \
            --push \
            .

      - name: Build and push db-init image
        working-directory: core/db-init
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx build \
            --platform ${{ env.PLATFORMS }} \
            -t "${{ env.IMAGE_PREFIX }}/db-init:${VERSION}" \
            -t "${{ env.IMAGE_PREFIX }}/db-init:latest" \
            --push \
            .

      - name: Build and push flow-enricher image
        working-directory: core/flow-enricher
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx build \
            --platform ${{ env.PLATFORMS }} \
            -t "${{ env.IMAGE_PREFIX }}/flow-enricher:${VERSION}" \
            -t "${{ env.IMAGE_PREFIX }}/flow-enricher:latest" \
            --push \
            .

      - name: Build and push prometheus-writer image
        working-directory: core/prometheus-writer
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx build \
            --platform ${{ env.PLATFORMS }} \
            -t "${{ env.IMAGE_PREFIX }}/prometheus-writer:${VERSION}" \
            -t "${{ env.IMAGE_PREFIX }}/prometheus-writer:latest" \
            --push \
            .

      - name: Build and push alerts-forwarder image
        working-directory: core/alerts-forwarder
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx build \
            --platform "${{ env.PLATFORMS }}" \
            -t "${{ env.IMAGE_PREFIX }}/alerts-forwarder:${VERSION}" \
            -t "${{ env.IMAGE_PREFIX }}/alerts-forwarder:latest" \
            --push \
            .

      - name: Build and push alarms-materializer image
        working-directory: core/alarms-materializer
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx build \
            --platform "${{ env.PLATFORMS }}" \
            -t "${{ env.IMAGE_PREFIX }}/alarms-materializer:${VERSION}" \
            -t "${{ env.IMAGE_PREFIX }}/alarms-materializer:latest" \
            --push \
            .

      - name: Build and push minion-gateway image
        # minion-gateway's Dockerfile lives at opennms-container/delta-v/minion-gateway/Dockerfile
        # (not core/minion-gateway/, unlike db-init / flow-enricher / prometheus-writer).
        # Build context is core/minion-gateway/ so the Dockerfile's
        # `COPY target/org.opennms.core.minion-gateway-*.jar` resolves against the
        # Maven-built fat JAR from the "Compile all modules" step.
        # JRE_BASE override mirrors the daemon-base step's JRE_IMAGE override —
        # without it, BuildKit tries to pull the unprefixed default
        # `deltav/jre-deltav:21` from docker.io and fails (the local-only tag
        # build.sh produces is not on a public registry).
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx build \
            --platform ${{ env.PLATFORMS }} \
            -f opennms-container/delta-v/minion-gateway/Dockerfile \
            --build-arg "JRE_BASE=${{ env.IMAGE_PREFIX }}/jre-deltav:21" \
            -t "${{ env.IMAGE_PREFIX }}/minion-gateway:${VERSION}" \
            -t "${{ env.IMAGE_PREFIX }}/minion-gateway:latest" \
            --push \
            core/minion-gateway

      - name: Build and push envoy image
        # Pure docker build — Envoy is the upstream image plus envoy.yaml + curl.
        # No Maven involvement.
        working-directory: opennms-container/delta-v/envoy
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx build \
            --platform ${{ env.PLATFORMS }} \
            -t "${{ env.IMAGE_PREFIX }}/envoy:${VERSION}" \
            -t "${{ env.IMAGE_PREFIX }}/envoy:latest" \
            --push \
            .

      - name: Build and push deltav/clickhouse image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx build \
            --platform ${{ env.PLATFORMS }} \
            -f opennms-container/delta-v/Dockerfile.clickhouse \
            -t "${{ env.IMAGE_PREFIX }}/clickhouse:${VERSION}" \
            -t "${{ env.IMAGE_PREFIX }}/clickhouse:latest" \
            --push \
            .

      - name: Build and push deltav/clickhouse-init image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx build \
            --platform ${{ env.PLATFORMS }} \
            -f opennms-container/delta-v/Dockerfile.clickhouse-init \
            -t "${{ env.IMAGE_PREFIX }}/clickhouse-init:${VERSION}" \
            -t "${{ env.IMAGE_PREFIX }}/clickhouse-init:latest" \
            --push \
            .

      - name: Build and push deltav/grafana image
        working-directory: opennms-container/delta-v
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx build \
            --platform ${{ env.PLATFORMS }} \
            -f Dockerfile.grafana \
            -t "${{ env.IMAGE_PREFIX }}/grafana:${VERSION}" \
            -t "${{ env.IMAGE_PREFIX }}/grafana:latest" \
            --push \
            .

      - name: Build and push deltav/provisiond-imports-init image
        working-directory: opennms-container/delta-v
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx build \
            --platform ${{ env.PLATFORMS }} \
            -f Dockerfile.provisiond-imports-init \
            -t "${{ env.IMAGE_PREFIX }}/provisiond-imports-init:${VERSION}" \
            -t "${{ env.IMAGE_PREFIX }}/provisiond-imports-init:latest" \
            --push \
            .

      - name: Build and push deltav/perspective-app-init image
        working-directory: opennms-container/delta-v
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx build \
            --platform ${{ env.PLATFORMS }} \
            -f Dockerfile.perspective-app-init \
            -t "${{ env.IMAGE_PREFIX }}/perspective-app-init:${VERSION}" \
            -t "${{ env.IMAGE_PREFIX }}/perspective-app-init:latest" \
            --push \
            .

      - name: Build and push deltav/l8opensim-provisioner image
        working-directory: opennms-container/delta-v
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx build \
            --platform ${{ env.PLATFORMS }} \
            -f Dockerfile.l8opensim-provisioner \
            -t "${{ env.IMAGE_PREFIX }}/l8opensim-provisioner:${VERSION}" \
            -t "${{ env.IMAGE_PREFIX }}/l8opensim-provisioner:latest" \
            --push \
            .

      - name: Build and push deltav/mock-snmp-agent image
        working-directory: opennms-container/delta-v/mock-snmp-agent
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx build \
            --platform ${{ env.PLATFORMS }} \
            -t "${{ env.IMAGE_PREFIX }}/mock-snmp-agent:${VERSION}" \
            -t "${{ env.IMAGE_PREFIX }}/mock-snmp-agent:latest" \
            --push \
            .

      - name: Build and push deltav/flow-exporter image
        working-directory: opennms-container/delta-v/flow-exporter
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx build \
            --platform ${{ env.PLATFORMS }} \
            -t "${{ env.IMAGE_PREFIX }}/flow-exporter:${VERSION}" \
            -t "${{ env.IMAGE_PREFIX }}/flow-exporter:latest" \
            --push \
            .

      - name: Build and push deltav/sflow-exporter image
        working-directory: opennms-container/delta-v/sflow-exporter
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx build \
            --platform ${{ env.PLATFORMS }} \
            -t "${{ env.IMAGE_PREFIX }}/sflow-exporter:${VERSION}" \
            -t "${{ env.IMAGE_PREFIX }}/sflow-exporter:latest" \
            --push \
            .

      - name: Print image summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "## Delta-V Images Published to GHCR"
          echo ""
          echo "Platforms: ${{ env.PLATFORMS }}"
          echo "Registry:  ${{ env.IMAGE_PREFIX }}"
          echo "Version:   ${VERSION}"
          echo ""
          echo "### Quick Start"
          echo ""
          echo "1. Set IMAGE_PREFIX in opennms-container/delta-v/.env:"
          echo "     IMAGE_PREFIX=${{ env.IMAGE_PREFIX }}"
          echo ""
          echo "2. Pull and deploy:"
          echo "     cd opennms-container/delta-v"
          echo "     docker compose pull"
          echo "     ./deploy.sh up lite"
          echo ""
          echo "### Images"
          DAEMONS="alarmd alerts-forwarder alarms-materializer bsmd collectd discovery enlinkd eventtranslator perspectivepollerd pollerd provisiond syslogd telemetryd trapd minion-boot db-init flow-enricher prometheus-writer clickhouse clickhouse-init grafana provisiond-imports-init perspective-app-init l8opensim-provisioner mock-snmp-agent flow-exporter sflow-exporter jre-deltav daemon-base"
          for name in $DAEMONS; do
            echo "  ${{ env.IMAGE_PREFIX }}/$name:${VERSION}"
          done
